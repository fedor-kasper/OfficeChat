# Сборка OfficeChat: exe для Windows, AppImage для Linux, APK для Android и сервер (Windows и Linux).
#
# - каждый push и pull request — файлы появляются в Actions → запуск → «Artifacts»;
# - метка вида v1.2.0 — дополнительно создаётся GitHub Release с этими файлами;
# - вручную — кнопка «Run workflow» на вкладке Actions.
#
# Проекты: OfficeChat.Core (общий код), OfficeChat.Windows (WPF), OfficeChat.Linux (Avalonia),
# OfficeChat.Mobile (интерфейс телефона) и OfficeChat.Android, OfficeChat.Server (сервер, тесты — OfficeChat.Server.Tests).
#
# Версия — 1.1.<номер запуска>. Если в секретах репозитория есть UPDATE_SIGNING_KEY, файлы подписываются:
# тогда программы в офисе обновляются друг от друга по сети. Без ключа сборка работает как обычно,
# но по сети не обновляется.
name: Сборка

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.1.${{ github.run_number }}
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  windows:
    name: Windows (exe)
    # WPF-проект собирается и на Linux (EnableWindowsTargeting) — так быстрее, чем на Windows-машине.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Сборка OfficeChat.exe (один файл, .NET не нужен)
        run: dotnet publish OfficeChat.Windows/OfficeChat.Windows.csproj -p:PublishProfile=SingleExe -p:Version=$VERSION

      - name: Подпись для обновления по сети
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            tools/sign-update.sh OfficeChat.Windows/bin/publish/OfficeChat.exe "$VERSION" win-x64
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — сборка без подписи, обновление по сети работать не будет"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeChat-windows-x64
          path: OfficeChat.Windows/bin/publish/OfficeChat.exe
          if-no-files-found: error

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Сборка AppImage
        run: |
          ./OfficeChat.Linux/build-appimage.sh
          # Имя без версии — удобно для постоянной ссылки на последнюю сборку
          mv OfficeChat.Linux/dist/OfficeChat-*-x86_64.AppImage OfficeChat.Linux/dist/OfficeChat-x86_64.AppImage

      - name: Подпись для обновления по сети
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            tools/sign-update.sh OfficeChat.Linux/dist/OfficeChat-x86_64.AppImage "$VERSION" linux-x64
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — сборка без подписи, обновление по сети работать не будет"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeChat-linux-x86_64
          path: OfficeChat.Linux/dist/OfficeChat-x86_64.AppImage
          if-no-files-found: error

  server:
    name: Сервер (Windows и Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Тесты сервера
        run: dotnet test OfficeChat.Server.Tests/OfficeChat.Server.Tests.csproj

      - name: Сборка сервера (один файл, .NET не нужен)
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish OfficeChat.Server/OfficeChat.Server.csproj -c Release -r $rid --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
              -p:DebugType=none -p:Version=$VERSION -o server-dist/$rid
          done
          mv server-dist/win-x64/officechat-server.exe server-dist/officechat-server-windows-x64.exe
          mv server-dist/linux-x64/officechat-server server-dist/officechat-server-linux-x64

      - name: Подпись сервера (для самообновления)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            tools/sign-update.sh server-dist/officechat-server-windows-x64.exe "$VERSION" server-win-x64
            tools/sign-update.sh server-dist/officechat-server-linux-x64 "$VERSION" server-linux-x64
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — сервер без подписи, сам обновляться не сможет"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeChat-server
          path: |
            server-dist/officechat-server-windows-x64.exe
            server-dist/officechat-server-linux-x64
          if-no-files-found: error

  android:
    name: Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Инструменты .NET для Android
        run: dotnet workload install android

      # Подпись приложения. Android обновляет программу поверх старой, только если подпись та же, — поэтому ключ
      # постоянный, в секретах репозитория (ANDROID_KEYSTORE — файл в base64, ANDROID_KEYSTORE_PASSWORD — пароль).
      # Без них сборка подписывается временным ключом: поставить можно, но следующую версию — только через удаление.
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          signing=()
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/officechat.keystore"
            signing=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/officechat.keystore"
              -p:AndroidSigningKeyAlias=officechat
              -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD)
          else
            echo "::warning::Секрет ANDROID_KEYSTORE не задан — APK подписан временным ключом, обновление поверх установленного не сработает"
          fi
          dotnet publish OfficeChat.Android/OfficeChat.Android.csproj -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME_17_X64" \
            -p:ApplicationDisplayVersion=$VERSION -p:ApplicationVersion=${{ github.run_number }} \
            "${signing[@]}"
          mkdir -p android-dist
          cp OfficeChat.Android/bin/Release/net10.0-android/publish/*-Signed.apk android-dist/OfficeChat-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeChat-android
          path: android-dist/OfficeChat-android.apk
          if-no-files-found: error

  release:
    name: Выпуск (GitHub Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Создание выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OfficeChat $GITHUB_REF_NAME" \
            --generate-notes
